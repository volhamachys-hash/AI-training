name: API Tests
on:
  push:
  workflow_dispatch:
# Tests of one stand share one database: never run two test jobs at once.
concurrency:
  group: api-${{ github.repository }}
  cancel-in-progress: false
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      SESSION_URL: ${{ secrets.SESSION_URL }}
      PUBLISHABLE_API_KEY: ${{ secrets.PUBLISHABLE_API_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Typecheck
      run: npm run typecheck
    - name: Skip API tests without a stand
      if: ${{ env.SESSION_URL == '' }}
      run: echo "::notice::Secret SESSION_URL is not set, API tests skipped. Add SESSION_URL, PUBLISHABLE_API_KEY, ADMIN_EMAIL, ADMIN_PASSWORD in Settings > Secrets and variables > Actions."
    # API tests need no browser: no `playwright install` step.
    - name: Run API tests
      if: ${{ env.SESSION_URL != '' }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && env.SESSION_URL != '' }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/results.json
        retention-days: 30
